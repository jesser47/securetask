# Pipeline minimal de l'étape 1 : seuls les tests s'exécutent.
# Les jobs de sécurité (Gitleaks, Semgrep, Bandit, Trivy, ZAP, SonarQube)
# seront ajoutés dans les étapes suivantes.
stages:
  - test

test:
  stage: test
  image: python:3.12-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    paths:
      - .cache/pip
  before_script:
    - pip install -r requirements-dev.txt
  script:
    - pytest
