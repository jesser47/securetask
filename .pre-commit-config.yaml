# Contrôles exécutés à chaque `git commit` (shift-left).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-yaml
      - id: check-added-large-files

  # SAST Python (les tests sont exclus : les assert y sont normaux)
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        exclude: ^tests/

  # Détection de secrets avec le binaire Gitleaks installé via winget
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (secrets)
        entry: gitleaks git --pre-commit --staged --redact --verbose
        language: system
        pass_filenames: false