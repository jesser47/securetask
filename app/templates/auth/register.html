{% extends "base.html" %}
{% block title %}Inscription{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm auth-card">
      <div class="card-body p-4">
        <h1 class="h4 mb-4 text-center">Créer un compte</h1>
        <form method="post" novalidate>
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label for="username" class="form-label">Nom d'utilisateur</label>
            <input type="text" class="form-control" id="username" name="username" value="{{ values.get('username', '') }}" required autocomplete="username">
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" value="{{ values.get('email', '') }}" required autocomplete="email">
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Mot de passe</label>
            <input type="password" class="form-control" id="password" name="password" minlength="8" required autocomplete="new-password">
            <div class="form-text">8 caractères minimum.</div>
          </div>
          <div class="mb-3">
            <label for="confirm" class="form-label">Confirmation</label>
            <input type="password" class="form-control" id="confirm" name="confirm" required autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-primary w-100">S'inscrire</button>
        </form>
        <p class="text-center small mt-3 mb-0">Déjà inscrit ? <a href="{{ url_for('auth.login') }}">Se connecter</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
