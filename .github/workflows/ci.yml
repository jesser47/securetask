# Pipeline CI : contrôles de sécurité bloquants avant build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  secrets_scan:
    name: secrets_scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet
      - name: Install Gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
      - name: Scan full git history (bloquant)
        run: ./gitleaks git --redact --verbose --report-format json --report-path gitleaks-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore

  sast_bandit:
    name: sast (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit
      - name: Rapport complet (toutes sévérités)
        run: bandit -r app config.py run.py -f json -o bandit-report.json --exit-zero
      - name: Gate Bandit (bloque si sévérité HIGH)
        run: bandit -r app config.py run.py -lll
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  sast_semgrep:
    name: sast (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install semgrep
      - name: Semgrep (bloque sur sévérité ERROR)
        run: >
          semgrep scan
          --config p/python --config p/flask --config p/owasp-top-ten
          --metrics off --severity ERROR --error
          --json --output semgrep-report.json
          app config.py run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report
          path: semgrep-report.json
          if-no-files-found: ignore

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  build-image:
    runs-on: ubuntu-latest
    needs: [secrets_scan, sast_bandit, sast_semgrep, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t securetask:${{ github.sha }} .
      - name: Smoke test (health endpoint)
        run: |
          docker run -d --name securetask -p 5000:5000 securetask:${{ github.sha }}
          for i in $(seq 1 15); do
            curl -fsS http://localhost:5000/health && exit 0
            sleep 2
          done
          docker logs securetask
          exit 1