# Pipeline de base (étape 2) : tests + build de l'image Docker.
# Les contrôles de sécurité seront ajoutés dans les étapes suivantes.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  build-image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t securetask:${{ github.sha }} .
      - name: Smoke test (health endpoint)
        run: |
          docker run -d --name securetask -p 5000:5000 securetask:${{ github.sha }}
          for i in $(seq 1 15); do
            curl -fsS http://localhost:5000/health && exit 0
            sleep 2
          done
          docker logs securetask
          exit 1